name: ctiks-app
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctiks
      POSTGRES_USER: ctiks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env.prod}
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctiks -d ctiks']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      DIRECT_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      REDIS_URL: redis://redis:6379
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-ctiks}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in env.prod or Coolify}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in env.prod or Coolify}
      CTIKS_LOCAL_HTTP: ${CTIKS_LOCAL_HTTP:-0}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ctiks.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CTIKS_INTERNAL_POSTGRES: '1'
      CTIKS_LOCAL_MEDIA_DIR: /data/ctiks-media
    volumes:
      - type: bind
        source: ${CTIKS_MEDIA_HOST_DIR:?Set CTIKS_MEDIA_HOST_DIR in env.prod}
        target: /data/ctiks-media
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  tools:
    profiles: ['maintenance']
    build:
      context: .
      dockerfile: Dockerfile.tools
    environment:
      DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/${RESTORE_DATABASE_NAME:-ctiks}
      CTIKS_LIVE_DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      TARGET_DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
    volumes:
      - type: bind
        source: ${CTIKS_BACKUP_HOST_DIR:?Set CTIKS_BACKUP_HOST_DIR in env.prod}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${CTIKS_MEDIA_HOST_DIR:?Set CTIKS_MEDIA_HOST_DIR in env.prod}
        target: /data/ctiks-media
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
  backup:
    build:
      context: .
      dockerfile: Dockerfile.tools
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      CTIKS_MEDIA_DIR: /data/ctiks-media
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    command: ['scripts/backup-manager.mjs', 'serve']
    volumes:
      - type: bind
        source: ${CTIKS_BACKUP_HOST_DIR:?Set CTIKS_BACKUP_HOST_DIR in env.prod}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${CTIKS_MEDIA_HOST_DIR:?Set CTIKS_MEDIA_HOST_DIR in env.prod}
        target: /data/ctiks-media
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data-v18:
  redis-data:
