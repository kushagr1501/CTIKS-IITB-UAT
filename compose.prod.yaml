name: ctiks-app
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctiks
      POSTGRES_USER: ctiks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env.prod}
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctiks -d ctiks']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file:
      - env.prod
    environment:
      DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      DIRECT_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
      REDIS_URL: redis://redis:6379
      CTIKS_INTERNAL_POSTGRES: '1'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  tools:
    profiles: ['maintenance']
    build:
      context: .
      dockerfile: Dockerfile.tools
    env_file:
      - env.prod
    environment:
      DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/${RESTORE_DATABASE_NAME:-ctiks}
      TARGET_DATABASE_URL: postgresql://ctiks:${POSTGRES_PASSWORD}@postgres:5432/ctiks
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
